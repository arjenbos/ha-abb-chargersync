      - condition: numeric_state
        entity: sensor.charger_solar_current_l1
        above: -1
      card:
        type: tile
        entity: sensor.charger_solar_current_l1
        name: Solar current L1
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:solar-power
        color: green
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_current_l1
        above: -1
      card:
        type: history-graph
        title: Current L1 · last 8 hours
        hours_to_show: 8
        entities:
        - entity: sensor.charger_current_l1
          name: Current L1 · last 8 hours
      grid_options:
        columns: 12
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_voltage_l2
        above: -1
      card:
        type: tile
        entity: sensor.charger_voltage_l2
        name: Voltage L2
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:flash-triangle-outline
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_current_l2
        above: -1
      card:
        type: tile
        entity: sensor.charger_current_l2
        name: Current L2
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:current-ac
        color: blue
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_solar_current_l2
        above: -1
      card:
        type: tile
        entity: sensor.charger_solar_current_l2
        name: Solar current L2
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:solar-power
        color: green
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_current_l2
        above: -1
      card:
        type: history-graph
        title: Current L2 · last 8 hours
        hours_to_show: 8
        entities:
        - entity: sensor.charger_current_l2
          name: Current L2 · last 8 hours
      grid_options:
        columns: 12
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_voltage_l3
        above: -1
      card:
        type: tile
        entity: sensor.charger_voltage_l3
        name: Voltage L3
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:flash-triangle-outline
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_current_l3
        above: -1
      card:
        type: tile
        entity: sensor.charger_current_l3
        name: Current L3
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:current-ac
        color: blue
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_solar_current_l3
        above: -1
      card:
        type: tile
        entity: sensor.charger_solar_current_l3
        name: Solar current L3
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:solar-power
        color: green
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_current_l3
        above: -1
      card:
        type: history-graph
        title: Current L3 · last 8 hours
        hours_to_show: 8
        entities:
        - entity: sensor.charger_current_l3
          name: Current L3 · last 8 hours
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Connection & device
      icon: mdi:lan-connect
    - type: tile
      entity: binary_sensor.charger_cloud_online
      name: Cloud connection
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      icon: mdi:cloud-outline
    - type: tile
      entity: binary_sensor.charger_remote_connected
      name: Remote connection
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      icon: mdi:connection
    - type: tile
      entity: binary_sensor.charger_fault
      name: Charging fault
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      icon: mdi:alert-circle-outline
    - type: tile
      entity: sensor.charger_firmware
      name: Installed firmware
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      icon: mdi:chip
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_maximum_current
        above: -1
      card:
        type: tile
        entity: sensor.charger_maximum_current
        name: Hardware current limit
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:current-ac
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.charger_remote_connected
        state: 'on'
      - condition: numeric_state
        entity: sensor.charger_fault_code
        above: -1
      card:
        type: tile
        entity: sensor.charger_fault_code
        name: Fault code
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        icon: mdi:alert-outline
        color: red
      grid_options:
        columns: 6
        rows: auto
    - type: history-graph
      title: Connection history
      hours_to_show: 24
      entities:
      - entity: binary_sensor.charger_cloud_online
        name: Cloud
      - entity: binary_sensor.charger_remote_connected
        name: Remote
    - type: markdown
      content: '**Reading the measurements**


        Power is apparent power in VA, not active power in W. Session readings are
        hidden when the charger does not report them.


        Firmware installation and network setup remain in the official app.'
- title: Management
  path: management
  icon: mdi:calendar-clock
  type: panel
  cards:
  - type: custom:chargersync-card
    entity: sensor.charger_charging_status
    title: CHARGER_DISPLAY_NAME management
